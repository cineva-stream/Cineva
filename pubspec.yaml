name: cineva
description: "Cineva — Free P2P Movie & TV Series Streaming App"
publish_to: 'none'

version: 1.1.7+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network & HTTP
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Web & Embedded Streaming
  webview_flutter: ^4.14.1

  # Video Player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Environment
  flutter_dotenv: ^5.2.1

  # UI/UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Icons
  iconsax_flutter: ^1.0.0
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "cineva.png"
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "cineva.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
