name: cineva
description: "Cineva — Free P2P Movie & TV Series Streaming App"
publish_to: 'none'

version: 1.1.7+18

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network & HTTP
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Web & Embedded Streaming
  webview_flutter: ^4.14.1

  # Video Player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.11

  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # UI/UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Icons
  iconsax_flutter: ^1.0.0
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  encrypt: ^5.0.3
  image_picker: ^1.2.4
  image: ^4.12.0
  window_manager: ^0.5.2
  file_picker: ^13.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "cineva.png"
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "cineva.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/platforms/
